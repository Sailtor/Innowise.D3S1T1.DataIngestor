name: Build and Push Docker image to GHCR (with codestyle check and tests)
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sailtor/innowise.d3s1t1.data_ingestor

jobs:
  codestyle-check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore ./Innowise.D3S1T1.DataIngestor.slnx
    - name: Format
      run: dotnet format ./Innowise.D3S1T1.DataIngestor.slnx --verify-no-changes --verbosity diagnostic --no-restore

  # The spec asks for unit tests and this repo has three test projects; until now nothing ran
  # them. Release, because that is what the image ships. All three are pure unit tests - no
  # Testcontainers, no Docker daemon needed.
  test:
    needs: codestyle-check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Test
      run: >
        dotnet test ./Innowise.D3S1T1.DataIngestor.slnx
        --configuration Release
        --logger "trx;LogFileName=test-results.trx"
        --collect:"XPlat Code Coverage"
        --results-directory ./TestResults
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: ./TestResults
        if-no-files-found: error

  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push docker image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: ./src/DataIngestor.AppHost/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  # `if: github.event_name == 'push'` is load-bearing now that pull_request is a trigger:
  # without it every PR would push a new DataIngestor.Contracts version to GitHub Packages,
  # burning version numbers off `github.run_number` and publishing unreviewed contracts.
  publish-contracts-nuget:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Pack
        run: >
          dotnet pack
          ./src/DataIngestor.Contracts/DataIngestor.Contracts.csproj
          --configuration Release
          /p:Version=1.0.${{ github.run_number }}
          --output ./nupkg
      - name: Push to GitHub Packages
        run: >
          dotnet nuget push ./nupkg/*.nupkg
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate
